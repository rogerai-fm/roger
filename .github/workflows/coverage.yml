name: coverage
# Runs the full suite with coverage, publishes the report + badge so coverage is always
# VISIBLE, THEN runs the gate last so a sub-90% run goes red without hiding the report.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write        # Pages publish to gh-pages
  pull-requests: write   # octocov PR comment
  actions: write         # octocov report/diff artifact datastore (octocov-report)

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    # Where the job runs is one repo variable. CI_RUNNER unset: GitHub's hosted runner. CI_RUNNER=lab: the
    # lab's own machine (two self-hosted runners labelled lab-heavy and lab-light), which costs no Actions
    # minutes. Every step below has to work on both: no sudo, no fixed ports, nothing written to $HOME
    # (our own runners keep their module, npm and temp directories on their own volume, set in the runner's
    # .env, so the actions' caches are for the hosted runner only). The lab label is honoured in this
    # repository alone: the public copy of this file always runs on the hosted runner.
    # The lab runners are system services under a dedicated unprivileged user (ghrunner, no sudo, rootless
    # podman) whose units make the machine owner's home folder inaccessible, so code from a pull request
    # cannot read the owner's keys or .env files. Do not register a runner under a personal account.
    # How to switch, check the runners and write steps that work on both: docs/ci-runners.md (kept in
    # the private repository; the public copy does not carry it).
    runs-on: ${{ github.repository == 'rogerai-fm/roger-core' && vars.CI_RUNNER && format('{0}-heavy', vars.CI_RUNNER) || 'ubuntu-latest' }}
    # A guard, not a budget: one run of the suite takes about 30 minutes. Without this a hung
    # setup step or service container could hold the runner for GitHub's 6-hour default.
    timeout-minutes: 75
    env:
      GOTOOLCHAIN: local
      # Enables the networked vulnerability scenario in the executable release spec.
      ROGERAI_RELEASE_GATE: "1"
      # Postgres: scripts/cover-gate.sh starts its own throwaway one (docker or podman, a port the runtime
      # picks, fsync off, the `rogerai` schema) when ROGERAI_TEST_DATABASE_URL is unset, the same way the
      # pre-push gate runs it. Valkey: the step below. Neither is a `services:` block, because a service
      # container needs docker on the runner and a fixed host port, and a self-hosted runner has neither.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true   # take the newest 1.26 patch (security fixes), not the runner's cached one
          cache: ${{ runner.environment == 'github-hosted' }}
      # The web scenarios' pinning tests run from Go (cmd/rogerai-broker/web_spec_test.go installs
      # web/'s pinned devDependencies with npm ci on first use): the same Node the web job uses.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json

      # Reject vulnerabilities that are reachable from RogerAI before main can go green.
      - name: reachable vulnerability gate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      # Real Valkey for the multi-instance/shared-state suites (liveness churn + cross-instance relay run
      # against the real protocol server, not only miniredis). Its port is read back, never pinned.
      - name: valkey
        env:
          CONTAINER_RUNTIME: ${{ runner.environment == 'github-hosted' && 'docker' || 'podman' }}
        run: scripts/ci-valkey.sh up

      # 1) Tests + coverage profile + the gate's grading, in ONE run of the suite. The gate script
      # runs go test itself (45m per package: the broker package is large and shares the runner,
      # founder-approved 2026-10-08) and leaves cover.out behind, so the report steps reuse it
      # instead of running the whole suite a second time (that second run was half of every
      # coverage job). Failing TESTS fail this step and stop the job, as before. A coverage
      # shortfall does not stop it here: it is recorded and turns the job red in the last step,
      # after the report and badge are published, so a red gate never hides the report.
      - name: test + coverage
        id: gate
        env:
          # one runtime for Postgres and Valkey: docker on the hosted image (it has both), podman on ours
          CONTAINER_RUNTIME: ${{ runner.environment == 'github-hosted' && 'docker' || 'podman' }}
        run: |
          set +e
          scripts/cover-gate.sh 2>&1 | tee gate.log
          rc=${PIPESTATUS[0]}
          set -e
          # cover-gate.sh exits 1 only for a coverage shortfall; 2 is failing tests or a gate that
          # could not run, and anything else is unexpected. All of those stop the job here.
          if [ "$rc" != 0 ] && { [ "$rc" != 1 ] || [ ! -s cover.out ]; }; then
            echo "::error::the test suite did not pass (or the gate could not run)"
            exit 1
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: valkey down
        if: always()
        env:
          CONTAINER_RUNTIME: ${{ runner.environment == 'github-hosted' && 'docker' || 'podman' }}
        run: scripts/ci-valkey.sh down

      # 2) Build the report site — ONLY the html + the func summary (not the whole repo).
      - name: build report + badge
        run: |
          mkdir -p _site
          go tool cover -html=cover.out -o _site/coverage.html
          go tool cover -func=cover.out | tee _site/coverage.txt | tail -1
          pct=$(go tool cover -func=cover.out | awk '/^total:/{gsub("%","",$3);print $3}')
          # Branded, self-contained badge (no SaaS): a dark ROGER·AI pill with the
          # signal-meter motif + a colored % segment - green at/above the 90% bar, amber below.
          if awk -v p="$pct" 'BEGIN{exit !(p+0>=90)}'; then color="#3fb950"; else color="#d29922"; fi
          printf '%s' "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"200\" height=\"20\" role=\"img\" aria-label=\"ROGER·AI coverage: ${pct}%\"><title>ROGER·AI coverage: ${pct}%</title><clipPath id=\"r\"><rect width=\"200\" height=\"20\" rx=\"3\"/></clipPath><linearGradient id=\"s\" x2=\"0\" y2=\"100%\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".07\"/><stop offset=\"1\" stop-opacity=\".07\"/></linearGradient><g clip-path=\"url(#r)\"><rect width=\"200\" height=\"20\" fill=\"#0d1117\"/><rect x=\"142\" width=\"58\" height=\"20\" fill=\"${color}\"/><rect width=\"200\" height=\"20\" fill=\"url(#s)\"/></g><g fill=\"#3fb950\"><rect x=\"9\" y=\"13\" width=\"2.5\" height=\"3\"/><rect x=\"13\" y=\"11\" width=\"2.5\" height=\"5\"/><rect x=\"17\" y=\"8\" width=\"2.5\" height=\"8\"/><rect x=\"21\" y=\"5\" width=\"2.5\" height=\"11\"/></g><g font-family=\"Verdana,DejaVu Sans,sans-serif\" font-size=\"11\"><text x=\"30\" y=\"14\" fill=\"#fff\" font-weight=\"bold\">ROGER·AI</text><text x=\"92\" y=\"14\" fill=\"#8b949e\">coverage</text><text x=\"171\" y=\"14\" fill=\"#fff\" font-weight=\"bold\" text-anchor=\"middle\">${pct}%</text></g></svg>" > _site/badge.svg

          # Per-PACKAGE summary from cover.out (the reassuring greens), so the public page
          # shows "every package vs the bar" instead of only the per-file dropdown - which
          # lists individual files <bar that live inside packages well above it. Aggregates
          # covered/total statements per package directory.
          awk 'NR>1 { split($1,a,":"); f=a[1]; n=split(f,p,"/"); pk=p[1]; for(i=2;i<n;i++) pk=pk"/"p[i]; t[pk]+=$2; if($3+0>0) c[pk]+=$2 } END{ for(k in t) printf "%6.1f%%  %s\n", 100*c[k]/t[k], k }' cover.out | sort -k2 > _site/packages.txt
          { echo "<!doctype html><meta charset=utf-8><title>RogerAI coverage by package</title>"; \
            echo "<style>body{background:#0d1117;color:#c9d1d9;font:14px/1.7 ui-monospace,Menlo,monospace;padding:24px}h1{font-size:16px;color:#fff}a{color:#58a6ff}</style>"; \
            echo "<h1>RogerAI — coverage by package (total ${pct}%, bar 90%)</h1><pre>"; cat _site/packages.txt; \
            echo "</pre><p><a href=coverage.html>per-file detail →</a></p>"; } > _site/packages.html

      # 3) octocov: PR coverage table + badge to gh-pages (reads .octocov.yml). Never blocks.
      - uses: k1LoW/octocov-action@v1
        continue-on-error: true

      # 4) Publish the report to gh-pages/coverage (main only) — BEFORE the gate, so a red
      #    gate never hides it. keep_files:false replaces coverage/ (cleans the earlier dump).
      #    -> https://rogerai-fm.github.io/roger/coverage/coverage.html
      - name: publish report to Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: coverage
          keep_files: false

      # 5) THE GATE's verdict, last, so it can go RED (sub-90%) without blocking the report/badge.
      #    The grading itself ran in step 1 (gate.log above); this step only reports it.
      - name: coverage gate (90% bar, aim 95%)
        run: |
          grep -E '^FAIL|\[cover\] gate' gate.log || true
          exit "${{ steps.gate.outputs.rc }}"
